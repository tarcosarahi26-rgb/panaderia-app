{% extends "base.html" %}
{% block titulo %}Borrar pedido — Panadería{% endblock %}
{% block content %}
<h1>¿Borrar este pedido?</h1>
<p>Estás a punto de borrar <strong>{{ pedido }}</strong>. Esta acción no se puede deshacer.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, borrar</button>
    <a href="{{ pedido.get_absolute_url }}">Cancelar</a>
</form>
{% endblock %}
